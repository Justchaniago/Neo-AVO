name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neo_avo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neo_avo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
        env:
          PG_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neo_avo
          DATABASE_SSL: disable
